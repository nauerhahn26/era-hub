# Builds New-ERA-Setup.exe from the public repos — the artifact SignPath
# Foundation signs (their policy requires CI provenance; the signing step is
# added to this workflow once the project is approved).
name: build-installer
on:
  workflow_dispatch:
    inputs:
      siblings_ref:
        description: "branch/tag to take the sibling repos at (blank: this ref's name, then their default branch)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out era-hub
        uses: actions/checkout@v4
        with: { path: era-hub }
      - name: Check out sibling app repos
        # a sibling ref named `siblings_ref`, else one named like this ref, else
        # the sibling's default branch — so a tag build takes the siblings'
        # masters, which must therefore already carry what the tag needs (9/5:
        # era-board's partner strip lived on an unmerged branch while the
        # locally cut installer had it from the working tree)
        env: { WANT: "${{ github.event.inputs.siblings_ref || github.ref_name }}" }
        run: |
          for r in era-core era-making-words era-pencil era-board; do
            git clone -q --depth 1 --branch "$WANT" "https://github.com/nauerhahn26/$r" "$r" 2>/dev/null \
              || git clone -q --depth 1 "https://github.com/nauerhahn26/$r" "$r"
            echo "$r: $(git -C "$r" rev-parse --abbrev-ref HEAD) $(git -C "$r" rev-parse --short HEAD)"
          done
      - name: Fetch portable Node runtime (official, checksum-verified)
        run: |
          NODE_VER=v22.22.2
          mkdir -p era-family/cache
          curl -fsSLo node.exe "https://nodejs.org/dist/$NODE_VER/win-x64/node.exe"
          curl -fsSLo SHASUMS256.txt "https://nodejs.org/dist/$NODE_VER/SHASUMS256.txt"
          grep " win-x64/node.exe$" SHASUMS256.txt | sed 's| win-x64/node.exe| node.exe|' | sha256sum -c -
          mv node.exe era-family/cache/node-22-win-x64.exe
      - name: Build payload
        run: bash era-hub/tools/build-payload.sh "$PWD/dist/new-era-suite" --with-node
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y nsis
      - name: Build New-ERA-Setup.exe
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          makensis -DPAYLOAD="$PWD/dist/new-era-suite" \
                   -DOUTFILE="$PWD/dist/New-ERA-Setup.exe" \
                   -DVERSION="$VERSION" era-hub/tools/installer.nsi
          sha256sum dist/New-ERA-Setup.exe
      # SignPath signing step lands here after Foundation approval:
      #   uses: signpath/github-action-submit-signing-request
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: New-ERA-Setup
          path: dist/New-ERA-Setup.exe
