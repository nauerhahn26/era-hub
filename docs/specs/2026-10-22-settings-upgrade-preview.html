<body>
<a class="skip" href="#main">Skip to settings</a>
<div class="demo-bar"><span class="demo-tag">DESIGN PREVIEW</span><span>Sample content · changes stay in this preview</span></div>
<div class="shell">
<div class="overlay" id="overlay"></div>
<aside aria-label="Settings navigation">
<div class="brand"><span class="brandmark" aria-hidden="true">e</span><div><strong>Our Era</strong><small>Settings</small></div></div>
 <div class="side-search" role="search"><input type="search" id="globalSearch" aria-label="Search all settings" placeholder="Search settings"><span aria-hidden="true">⌕</span></div>
 <nav id="nav" aria-label="Settings sections"></nav>
 <div class="side-footer"><div class="small"><span class="dot"></span>This computer</div><p>Preferences are saved here.<br>Content can sync through Drive.</p></div>
</aside>
<main id="main" tabindex="-1">
 <div class="topline"><button class="mobile-menu" id="menu" aria-label="Open sections" aria-expanded="false">☰</button><div class="breadcrumbs"><span>Settings</span><span aria-hidden="true">/</span><strong id="crumb">Books</strong></div><button class="quiet back-apps" data-action="apps-return">← Back to apps</button></div>
 <div class="content" id="contentPane"></div>
</main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// Standalone design artifact. All content and interaction state are synthetic.
// No network, credentials, storage, or connection to a running hub.
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages=[
 {id:'gaze',label:'Eye gaze',icon:'◎',group:'Comfort & control',desc:'Dwell, page changes, cursor feel and visibility.'},

 {id:'apps',label:'Apps & navigation',icon:'▦',group:'Comfort & control',desc:'Available apps, exit door and media lock.'},
 {id:'books',label:'Books',icon:'▤',group:'Content',desc:'Library, build progress, review and book setup.'},
 {id:'clothing',label:'Clothing & weather',icon:'♧',group:'Content',desc:'Wardrobe, outfit progress, weather location and hours.'},
 {id:'media',label:'Writing & media',icon:'✎',group:'Content',desc:'Saved Pencil writing, films and this week’s videos.'},
 {id:'connections',label:'Connections',icon:'⇄',group:'This computer',desc:'Drive, AI helper, voice, email and media service setup.'},
 {id:'system',label:'System',icon:'⚙',group:'This computer',desc:'Updates and eye-gaze troubleshooting.'}
];
const books=[
 ['The Little Moon','Ready','18 pages · Narration included','☾','#e5e4f2'],
 ['A Day at the Garden','Needs review','3 pages to glance at · Ready to read','✿','#e1ebce'],
 ['The Red Umbrella','Ready','14 pages · Narration included','☂','#f1dcd5'],

 ['A Very Small Adventure','Needs review','2 pages to glance at · Ready to read','✧','#eee6d2'],
 ['Good Morning, Birds','Ready','12 pages · Narration included','♬','#dde9e4'],
 ['The Quiet Forest','Ready','16 pages · Narration included','♧','#dfe9d6'],
 ['My Blue Boots','Ready','10 pages · Narration included','♙','#d8e7ef'],
 ['The Paper Boat','Building','Recording narration · On this computer','◇','#eee7d5'],
 ['A Pocket of Stars','Ready','20 pages · Narration included','✦','#e4dff0'],
 ['The Busy Baker','Ready','12 pages · Narration included','♜','#f0e1d1'],
 ['Rain on the Roof','Needs review','1 page to glance at · Ready to read','☂','#dce5ef'],
 ['Our Big Picnic','Ready','16 pages · Narration included','❀','#e7ead5'],
 ['The Last Leaf','Waiting','Voice allowance renews tomorrow · Pages kept','♧','#eee2d3'],
 ['A Friend for the Fox','Ready','18 pages · Narration included','✧','#efdfd4'],
 ['Home Before Bedtime','Ready','12 pages · Narration included','⌂','#dedfee']
].map((b,i)=>({title:b[0],status:b[1],note:b[2],icon:b[3],color:b[4],id:i}));
let active='books',tab='library',filter='All books',bookQuery='',bookPage=0,bookSort='original',toastTimer;
const values={dwell:1200,pencil:1500,settle:250,cap:45,music:80,lock:45};
const settingIndex=[
 ['gaze','Dwell time','How long to hold your gaze before a selection.','dwell hold selection'],
 ['gaze','Alternative Pencil dwell time','A separate dwell time for The Pencil.','writing pencil hold'],
 ['gaze','Page-change pause','Settle before selecting on a new page.','settle page pause'],
 ['gaze','Cursor feel & visibility','Cursor smoothing, look-away forgiveness and visible ring.','cursor smooth grace forgiveness ring visible'],
 ['gaze','Pause eye gaze','Temporarily pause the cursor.','pause test running'],
 ['sound','Volume cap for this device','Limit speaker volume on this computer.','speaker sound volume cap loudness'],
 ['sound','Music volume cap','Set music volume relative to speaker volume.','music songs volume sound cap'],
 ['sound','Speaking voice','Choose the voice used by the apps.','voice narration speech tts'],
 ['apps','Apps on this computer','Choose available apps and shortcuts.','install enabled hide apps shortcuts'],
 ['apps','Where the door goes','Choose TD Snap or the app home screen.','exit door home talker'],
 ['apps','Media lock','Lock music and films; choose duration and passcode.','lock pin passcode films music'],
 ['books','Book library','Find, build, review and rename books.','books library reading review rename'],
 ['clothing','Weather location & hours','Choose the weather used for outfits.','weather location city zip hours clothes'],
 ['clothing','Wardrobe & outfits','See outfit preparation and clothing status.','wardrobe accessories outfits photos'],
 ['media','Saved writing','See words sent from The Pencil.','writing pencil email send words'],
 ['media','Films & this week’s videos','Film setup and this computer’s video downloads.','movies film shows video download week'],
 ['connections','Drive folder & sync','Connect the folder that carries content between devices.','drive folder sync integrations'],
 ['connections','AI helper','Configure a key for content preparation.','ai helper key provider'],
 ['connections','Voice service','Manage the key for recorded speech.','voice key narration credits'],
 ['connections','Moving pages','Configure the service used for moving book pages.','moving pages animation video key'],
 ['connections','Email & film services','Configure email delivery and film lookup.','email key movie poster tmdb watchmode'],
 ['system','Updates','Check this computer’s installed version and update status.','updates version build install'],
 ['system','Stop eye gaze completely','Release the tracker for testing another eye-gaze app.','shutdown stop release tracker maintenance']
];
function pill(s){return `<span class="pill ${s==='Needs review'?'review':s.toLowerCase()}">${s==='Ready'?'✓ ':s==='Building'?'◌ ':s==='Waiting'?'◷ ':''}${esc(s)}</span>`}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
function pageHeader(title,desc,scope='This computer'){return `<div class="page-header"><div><h1 tabindex="-1">${title}</h1><p>${desc}</p></div>${scope?`<span class="scope optional">${scope}</span>`:''}</div>`}
function btn(text,action,cls=''){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function link(text,target){return `<a href="#${target}">${text}</a>`}
function row(title,desc,control){return `<div class="setting-row"><div><h3>${title}</h3><p>${desc}</p></div><div class="controls">${control}</div></div>`}
function step(key,unit,min,max,inc){return `<button class="step-button" aria-label="Decrease ${key}" data-step="${key}" data-delta="-${inc}" data-min="${min}" data-max="${max}">−</button><output class="step-value" data-value="${key}">${values[key]}${unit}</output><button class="step-button" aria-label="Increase ${key}" data-step="${key}" data-delta="${inc}" data-min="${min}" data-max="${max}">+</button>`}
function seg(label,options,selected){return `<div class="seg" aria-label="${label}">${options.map(o=>`<button aria-pressed="${o===selected}" data-segment="${label}">${o}</button>`).join('')}</div>`}
function tabs(items,current){return `<div class="section-tabs" aria-label="Books views">${items.map(([id,label])=>`<button data-tab="${id}" aria-pressed="${id===current}">${label}</button>`).join('')}</div>`}
function renderNav(){let last='';$('#nav').innerHTML=pages.map(p=>{const group=p.group!==last?`<div class="eyebrow">${p.group}</div>`:'';last=p.group;return group+`<a href="#${p.id}" ${p.id===active?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${p.icon}</span>${p.label}</a>`}).join('')}
function renderBooks(){return pageHeader('Books','Find a book, check progress, or review its pages.','Drive content')+tabs([['library','Library'],['activity','Build activity'],['setup','Book setup']],tab)+(tab==='library'?`<div class="summary"><div><div class="summary-title">Your library, in one place</div><p>16 sample books · 2 building here · 3 with pages to review</p></div>${btn('Look for books','sync','primary')}</div><div class="library-toolbar"><div class="book-search"><input type="search" id="bookSearch" aria-label="Search books" placeholder="Search your books" value="${esc(bookQuery)}"></div><select id="bookSort" aria-label="Sort books"><option value="original">Recently added</option><option value="title" ${bookSort==='title'?'selected':''}>Title A–Z</option></select></div><div class="filters">${['All books','Needs review','Building','Waiting'].map(f=>`<button data-filter="${f}" aria-pressed="${filter===f}">${f}<span class="count">${f==='All books'?16:books.filter(b=>b.status===f).length}</span></button>`).join('')}</div><div class="library" id="bookList"></div><div class="help-line"><span>Showing sample titles and statuses for this design.</span>${link('How to add a book →','books/setup')}</div>`:tab==='activity'?`<div class="cards"><div class="card"><h2>Building on this computer</h2>${books.filter(b=>b.status==='Building').map(b=>row(b.title,b.note,pill(b.status))).join('')}</div><div class="card"><h2>Waiting for allowance</h2>${row('The Last Leaf','Voice allowance renews tomorrow. Every page already made is kept.',pill('Waiting'))}<p>Costs, provider and the next available action appear with the affected book.</p></div></div>`:`<div class="cards"><div class="card"><h2>Add a book</h2><p>Put photos of one book into its own folder in Drive, then choose Build on the computer that should prepare it.</p><div class="link-row"><div><h3>Content folder</h3><p>Connected · Book files sync through Drive.</p></div>${link('Manage Drive →','connections/drive')}</div><div class="link-row"><div><h3>Reading & narration</h3><p>AI reads the pages. A voice service can record the narration.</p></div>${link('Manage services →','connections')}</div><div class="link-row"><div><h3>Moving pages</h3><p>Optional animation. Show the price and confirm each paid request.</p></div>${link('Moving pages setup →','connections/moving')}</div></div><details><summary>How building, review and costs work</summary><div><p>Only the computer where you choose Build does the work. A completed book can appear in Book Reader on other devices through Drive. Uncertain words are marked for review, and your own corrections are kept.</p><p>Exact current allowances and any price would come from the running hub. This preview uses sample content.</p></div></details></div>`)}
function renderBookList(){const list=$('#bookList');if(!list)return;let matches=books.filter(b=>(filter==='All books'||b.status===filter)&&b.title.toLowerCase().includes(bookQuery.toLowerCase()));if(bookSort==='title')matches.sort((a,b)=>a.title.localeCompare(b.title));const pageCount=Math.max(1,Math.ceil(matches.length/6));bookPage=Math.min(bookPage,pageCount-1);const start=bookPage*6,visible=matches.slice(start,start+6);list.innerHTML=`<div class="list-caption"><span>Book</span><span>Progress & review</span></div>`+(visible.length?visible.map(b=>`<div class="book-row"><div class="cover" style="background:${b.color}" aria-hidden="true">${b.icon}</div><div class="book-info"><strong>${esc(b.title)}</strong><p>${esc(b.note)}</p>${pill(b.status)}</div>${pill(b.status)}<button aria-label="View book: ${esc(b.title)}" data-book="${b.id}">View →</button></div>`).join(''):'<div class="empty">No books match this search. Try another title or filter.</div>')+`<div class="pagination"><span id="pageCount">${matches.length?start+1:0}–${Math.min(start+6,matches.length)} of ${matches.length} books</span><div class="buttons"><button aria-label="Previous page" data-page="-1" ${bookPage===0?'disabled':''}>←</button><button aria-label="Next page" data-page="1" ${bookPage===pageCount-1?'disabled':''}>→</button></div></div>`}
function renderGaze(){return pageHeader('Eye gaze','Make selections feel comfortable and predictable.')+`<div class="cards"><div class="card"><h2>Selection timing</h2>${row('Dwell time','Hold your gaze this long to select. Used by the apps on this computer.',step('dwell',' ms',600,3000,100))}${row('Alternative Pencil dwell time','The Pencil has its own timing.',step('pencil',' ms',600,3000,100))}${row('Page-change pause','A short settling time when a new page appears.',step('settle',' ms',0,2000,50))}</div><div class="card"><h2>Cursor</h2>${row('Cursor feel','How firmly the cursor follows each movement.',seg('Cursor feel',['Steady','Balanced','Responsive'],'Balanced'))}${row('Look-away forgiveness','A brief glance away does not immediately lose a selection.',seg('Look-away forgiveness',['Short','Medium','Long'],'Medium'))}${row('Cursor visible','Show the cursor and dwell ring.',seg('Cursor visible',['On','Off'],'On'))}</div><div class="card"><h2>Pause for testing</h2>${row('Eye-gaze cursor','Pausing keeps the tracker connected.',seg('Eye gaze',['Running','Paused'],'Running'))}<p>Need to release the tracker completely? ${link('Open System →','system')}</p></div></div>`}
function renderSound(){return pageHeader('Voice & sound','Choose a speaking voice and comfortable volume limits.')+`<div class="cards"><div class="card"><h2>Speaking voice</h2><p>Used by Making Words and The Pencil on this computer.</p>${row('Voice','A short sample lets you listen before choosing.',`<select aria-label="Speaking voice"><option>Warm voice</option><option>Clear voice</option><option>Computer voice</option></select>${btn('Listen','listen')}`)}<div class="link-row"><div><h3>Recorded narration service</h3><p>Sample: connected · allowance available.</p></div>${link('Manage voice service →','connections/voice')}</div></div><div class="card"><h2>Volume limits</h2>${row('Volume cap for this device','Applies to this computer’s speakers. Raising it does not raise the current volume.',seg('Device cap',['On','Off'],'On'))}${row('Maximum speaker volume','Saved by the local gaze engine.',step('cap','%',0,100,5))}${row('Music volume cap','Music volume relative to speaker volume. Separate from the speaker limit.',step('music','%',1,100,5))}<div class="notice">Sample controls only. Adjusting these values does not change your tablet’s volume.</div></div></div>`}
function renderApps(){return pageHeader('Apps & navigation','Choose available apps and what the app controls do.')+`<div class="cards"><div class="card"><h2>Apps on this computer</h2><p>Hide an app and its shortcut, or make it available again.</p>${['Book Reader','Making Words','Alternative Pencil','Clothing Picker','Drawing','Music & films','This week'].map(a=>row(a,'Available on this computer.',seg(a,['On','Off'],'On'))).join('')}</div><div class="card"><h2>Doors & media lock</h2>${row('Where the door goes','Used by the exit and talk doors.',seg('Door destination',['TD Snap','App home'],'TD Snap'))}${row('Media lock duration','Locks music and films while communication and other apps keep working.',step('lock',' min',0,1440,5))}<div class="link-row"><div><h3>Unlock passcode</h3><p>Optional four-digit code.</p></div>${btn('Set passcode','passcode')}</div></div></div>`}
function renderClothing(){return pageHeader('Clothing & weather','Keep wardrobe choices and the forecast together.')+`<div class="cards"><div class="card"><h2>Wardrobe & outfits</h2><p>Sample: clothing photos are up to date. Daily outfits are ready.</p>${row('New clothing photos','Look in the clothing folder and prepare new items.',btn('Look for new photos','outfits'))}<div class="link-row"><div><h3>Her picks & accessories</h3><p>Favourites, outfit history and wardrobe status belong here.</p></div>${btn('See sample status','wardrobe')}</div></div><div class="card"><h2>Weather for outfits</h2>${row('Weather location','The location used on this computer.',btn('Choose location','location'))}${row('Dress for these hours','Use the weather during the part of the day that matters.',`<label class="small">From <select aria-label="Weather start"><option>8 am</option><option>9 am</option></select></label><label class="small">to <select aria-label="Weather end"><option>3 pm</option><option>4 pm</option></select></label>`)}<p>Weather settings are saved on this computer.</p></div><div class="card"><h2>Photo source & preparation</h2><p>Wardrobe photos come from Drive. The AI helper prepares the pictures.</p><div class="link-row"><h3>Connected services</h3>${link('Manage Drive & AI →','connections')}</div></div></div>`}
function renderMedia(){return pageHeader('Writing & media','Saved words, films and this week’s learning content.')+`<div class="cards"><div class="card"><h2>Writing from The Pencil</h2><p>Browse saved writing without mixing it with connection setup.</p><div class="link-row"><div><h3>A sunny day</h3><p>Sample writing · Today</p></div>${btn('Read','writing')}</div><div class="link-row"><div><h3>Email delivery</h3><p>Choose where new writing is sent.</p></div>${link('Manage email →','connections/email')}</div></div><div class="card"><h2>Films & shows</h2><p>Paste a film link on the board, or connect a lookup service to find films and posters by name.</p><div class="link-row"><h3>Film lookup & country</h3>${link('Manage film services →','connections/films')}</div></div><div class="card"><h2>This week’s videos</h2>${row('Download on this computer','Other computers can play the videos brought over through Drive.',seg('Weekly downloads',['Yes','No'],'Yes'))}</div><div class="card"><h2>Moving book pages</h2><p>Optional animation belongs with a book. Its service connection is managed in one place.</p><div class="link-row">${link('Book setup →','books/setup')}${link('Moving pages service →','connections/moving')}</div></div></div>`}
const connectionInfo=[['drive','Drive folder & sync','Sample: content folder connected','⇄'],['ai','AI helper','Sample: key verified','✧'],['voice','Recorded voice','Sample: key verified','♫'],['email','Writing email','Sample: not set up','✉'],['moving','Moving pages','Sample: not set up','▷'],['films','Film lookup','Sample: lookup connected','▣']];
function connectionFields(id){if(id==='drive')return `<p>Content folders can travel between computers. Settings and keys remain on this computer.</p><div class="field-actions">${btn('Choose folder','folder')}${btn('Sync now','sync')}${btn('Open folder','folder')}</div>`;return `<p>One authoritative place for ${id==='ai'?'AI preparation':id==='voice'?'recorded narration':id==='email'?'email delivery':id==='films'?'film search and poster':'optional animation'} setup. Feature pages link here.</p>${id==='ai'?'<div class="field"><label for="provider">AI helper service</label><select id="provider"><option>Free service</option><option>Paid service</option></select></div><div class="notice">Show the selected service’s cost and data-use explanation before saving a key.</div>':''}${id==='email'?'<div class="field"><label for="sampleEmail">Email address</label><input id="sampleEmail" type="email" placeholder="Your email address" autocomplete="off"></div>':''}${id==='films'?'<div class="field"><label for="sampleCountry">Country</label><input id="sampleCountry" placeholder="Country code" maxlength="2"></div>':''}<div class="field"><label for="key-${id}">Sample key</label><input id="key-${id}" type="password" placeholder="Use sample text only" autocomplete="off"></div><div class="field-actions">${btn('Try sample connection','connect','primary')}${btn('Setup help','help')}</div><p style="margin-top:12px">No information is saved or sent in this preview.</p>`}
function renderConnections(sub){return pageHeader('Connections','Set up a service once, then return to what you were doing.')+`<div class="summary"><div><div class="summary-title">Service setup stays in one place</div><p>Books, clothing, voice and writing link to their relevant connection.</p></div><span class="pill">Sample state</span></div>`+connectionInfo.map(([id,title,note,icon])=>`<details id="connection-${id}" ${sub===id?'open':''}><summary>${title} <span class="muted small"> · ${note}</span></summary><div>${connectionFields(id)}</div></details>`).join('')}
function renderSystem(){return pageHeader('System','Updates and occasional troubleshooting on this computer.')+`<div class="cards"><div class="card"><h2>Updates</h2><p>Sample: this computer is up to date.</p>${row('Check for updates','The existing automatic update behavior is preserved.',btn('Check now','update'))}<details style="margin-top:18px"><summary>Version details</summary><div><p>The installed version and update status would appear here.</p></div></details></div><div class="card"><h2>Eye-gaze troubleshooting</h2>${row('Pause the cursor','A quick pause keeps the tracker connected.',link('Go to Eye gaze →','gaze'))}<details style="margin-top:20px"><summary>Release the tracker completely</summary><div><p>Stop ERAgaze completely to test another eye-gaze app. Keep the existing two-step confirmation and restart guidance.</p><div class="field-actions">${btn('Preview stop confirmation','stop')}</div></div></details></div></div>`}
function renderSearch(q){const terms=q.toLowerCase().trim().split(/\s+/);const hits=settingIndex.filter(x=>terms.every(t=>x.join(' ').toLowerCase().includes(t)));$('#crumb').textContent='Search';$('#contentPane').innerHTML=pageHeader('Search settings',`${hits.length} result${hits.length===1?'':'s'} for “${esc(q)}”`,'')+hits.map(([id,title,desc])=>`<a class="search-result" href="#${id}"><div class="result-path">Settings / ${pages.find(p=>p.id===id).label}</div><strong>${esc(title)}</strong><p>${esc(desc)}</p></a>`).join('')+(hits.length?'':'<div class="empty">No settings found. Try “volume”, “weather”, “dwell” or “books”.</div>')}
const aliases={content:'books',integrations:'connections/drive',voice:'sound',ai:'connections/ai',fal:'connections/moving',movies:'connections/films',writing:'media',exit:'apps',weekVideos:'media',lock:'apps',updates:'system'};
function route(){let raw=decodeURIComponent(location.hash.slice(1)||'books');if(raw==='main'){$('#main').focus();return}raw=aliases[raw]||raw;const [id,sub]=raw.split('/');active=pages.some(p=>p.id===id)?id:'books';if(active==='books')tab=['activity','setup'].includes(sub)?sub:'library';renderNav();$('#crumb').textContent=pages.find(p=>p.id===active).label;$('#globalSearch').value='';const renderers={gaze:renderGaze,sound:renderSound,apps:renderApps,books:renderBooks,clothing:renderClothing,media:renderMedia,connections:()=>renderConnections(sub),system:renderSystem};$('#contentPane').innerHTML=renderers[active]();renderBookList();$('#main').scrollTop=0;document.body.classList.remove('nav-open');$('#menu').setAttribute('aria-expanded','false');const h=$('#contentPane h1');if(h)h.focus({preventScroll:true})}
function closeDialog(){const d=$('dialog');if(d){d.close();d.remove()}}
function showDialog(title,body){closeDialog();const d=document.createElement('dialog');d.innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button class="quiet" data-action="close-dialog" aria-label="Close details">✕</button></div><div class="dialog-body">${body}</div>`;document.body.appendChild(d);d.addEventListener('cancel',()=>{setTimeout(()=>d.remove(),0)});d.addEventListener('close',()=>d.remove());d.showModal()}
document.addEventListener('click',e=>{
 const filterButton=e.target.closest('[data-filter]');if(filterButton){filter=filterButton.dataset.filter;bookPage=0;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===filterButton)));renderBookList();return}
 const tb=e.target.closest('[data-tab]');if(tb){location.hash='books'+(tb.dataset.tab==='library'?'':'/'+tb.dataset.tab);return}
 const pager=e.target.closest('[data-page]');if(pager){bookPage+=Number(pager.dataset.page);renderBookList();return}
 const book=e.target.closest('[data-book]');if(book){const b=books[Number(book.dataset.book)];showDialog(b.title,`${pill(b.status)}<p>${esc(b.note)}</p><p>Book details hold the review, rename and build actions, plus any error, allowance or cost information that applies to this book.</p><div class="field-actions">${btn('Preview review','review','primary')}${btn('Preview rename','rename')}</div><p class="small">Sample book only. Production review screens would keep their current behavior.</p>`);return}
 const st=e.target.closest('[data-step]');if(st){const k=st.dataset.step;values[k]=Math.max(Number(st.dataset.min),Math.min(Number(st.dataset.max),values[k]+Number(st.dataset.delta)));const unit=['cap','music'].includes(k)?'%':k==='lock'?' min':' ms';document.querySelector(`[data-value="${k}"]`).textContent=values[k]+unit;toast('Changed in this preview only');return}
 const sg=e.target.closest('[data-segment]');if(sg){sg.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===sg)));toast('Changed in this preview only');return}
 const ac=e.target.closest('[data-action]');if(ac){const a=ac.dataset.action;if(a==='close-dialog'){closeDialog();return}if(a==='stop'){showDialog('Stop eye gaze?',`<p>The live control would release the tracker completely, with a second confirmation and instructions to restart. This preview cannot stop anything.</p>${btn('Close preview','close-dialog')}`);return}if(a==='rename'){showDialog('Rename book','<div class="field"><label for="bookTitle">Book title</label><input id="bookTitle" placeholder="A new sample title"></div>'+btn('Preview save','save'));return}if(a==='location'){showDialog('Weather location','<p>The existing place search will live here, next to the hours used for outfits.</p><div class="field"><label for="samplePlace">Town or postal code</label><input id="samplePlace" placeholder="Sample location"></div>'+btn('Close preview','close-dialog'));return}if(a==='passcode'){showDialog('Media lock passcode','<p>Keep the current four-digit passcode behavior and validation.</p><div class="field"><label for="samplePin">Sample passcode</label><input id="samplePin" type="password" inputmode="numeric" maxlength="4"></div>'+btn('Preview save','save'));return}if(a==='writing'){showDialog('A sunny day','<p>“I like the sunshine. Let’s go outside.”</p><p>Sample writing shown for the design. Real entries would preserve their text and date.</p>');return}const messages={sync:'Preview: the existing content scan would run here.',outfits:'Preview: look for clothing photos using the existing action.',update:'Preview: check using the existing update flow.',listen:'Preview: the chosen voice would play a short sample.',connect:'Sample connection verified. Nothing was sent or saved.',save:'Sample accepted. Nothing was saved.',review:'Preview: open the existing book review screen.',wardrobe:'Sample: outfits ready · accessories and favourites available.',folder:'Preview: open the existing folder picker.',help:'Preview: show the relevant service setup instructions.','apps-return':'Preview only. The live link returns to your apps.'};toast(messages[a]||'Preview interaction');}
 const searchResult=e.target.closest('.search-result');if(searchResult){$('#globalSearch').value='';if(location.hash===searchResult.getAttribute('href'))route()}
});
document.addEventListener('input',e=>{if(e.target.id==='bookSearch'){bookQuery=e.target.value;bookPage=0;renderBookList()}if(e.target.id==='globalSearch'){const q=e.target.value.trim();if(q)renderSearch(q);else route()}});
document.addEventListener('change',e=>{if(e.target.id==='bookSort'){bookSort=e.target.value;bookPage=0;renderBookList()}});
$('#menu').onclick=()=>{const open=document.body.classList.toggle('nav-open');$('#menu').setAttribute('aria-expanded',String(open));if(open)$('#globalSearch').focus()};
$('#overlay').onclick=()=>{document.body.classList.remove('nav-open');$('#menu').setAttribute('aria-expanded','false');$('#menu').focus()};
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&document.body.classList.contains('nav-open')){const items=[...document.querySelectorAll('aside input, aside a')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.key==='Escape'&&document.body.classList.contains('nav-open')){$('#overlay').click()}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();if(innerWidth<=760){document.body.classList.add('nav-open');$('#menu').setAttribute('aria-expanded','true')}$('#globalSearch').focus()}});
window.addEventListener('hashchange',route);route();
</script>
</body>
