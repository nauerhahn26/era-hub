<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Reader</title>
<!-- the shared message bar (era-core lib/doorbar.js), FIRST so this page's own
     stylesheet still has the last word about anything it wants to tune -->
<link rel="stylesheet" href="../lib/doorbar.css">
<style>
  /* ============================================================
     Book Reader v2 — the OLD Book-Reader UI (dad: "I like my old
     layout. Please match.") ported 1:1 from Book-Reader's
     app/globals.css + reader-client.tsx / library-client.tsx onto
     the hub's local package data layer. Values below are copied
     verbatim from globals.css — do not "improve" them.
     Data stays local: /books/index.json + per-book manifest.json,
     recorded mp3 narration (NEVER speechSynthesis).
     ============================================================ */
  :root {
    --bg: #f5f7f2;
    --ink: #1f2b2c;
    --panel: #ffffff;
    --line: #d4ddd9;
    --muted: #5f6d6e;
    --primary: #0b3a52;
    --brand-coral: #de6e4b;
    --highlight-yellow: #f5c43a;
    --radius: 14px;
  }
  * { box-sizing: border-box; user-select: none; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Avenir Next', 'Trebuchet MS', sans-serif;
  }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }

  .screen { display: none; }
  .screen.show { display: block; }
  /* BOTH screens sit UNDER the shared door bar (9/17). The bar is the page's
     one in-flow element; the screens are fixed, so they take the strip off the
     top themselves. --bar-h is published by doorbar.js's sizeBar() and mirrored
     onto <html> by reader.js (the screens are the bar's SIBLINGS, and a custom
     property only travels downwards). 0px until the bar mounts — a screen must
     never wait on a fetch to be the right size. */
  #sShelf.show { position: fixed; inset: 0; top: var(--bar-h, 0px); overflow-y: auto; padding: 18px 14px; }
  #sRead.show { position: fixed; inset: 0; top: var(--bar-h, 0px); }

  /* ==== dwell targets: era-core dwell.js ENGINE + the old DwellButton LOOK.
     The engine injects .dwell-fx > .dwell-fill/.dwell-flash/.dwell-ring; we
     hide its rising fill and restyle its ring into the old conic progress
     ring (reader.js mirrors fill height into --dwell-progress). ==== */
  /* display:flex + centring stands in for the <button> element the old app
     used (these are divs, so nothing centres the label for us). It must NOT
     leak into the tiles that re-declare display:grid — see .shelf-card-button
     below, which resets it. */
  .dwell-button {
    position: relative;
    min-height: 72px;
    padding: 12px 14px;
    font-size: 1.05rem;
    font-weight: 700;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .dwell-button.is-disabled { opacity: 0.4; }
  /* :not(.bardoor) — THE BAR IS NOT THE READER'S (9/17). These two rules are
     the old DwellButton LOOK, and the shared strip above the app must keep the
     look era-core gives it: doorbar.css's own onset gate (~200ms of nothing, so
     a glance across 🚪/💬 flashes no feedback) lives on .bardoor .dwell-fill,
     and `opacity:0 !important` here used to beat it outright — the feedback
     moved to the ring below, which has NO gate at all, and the two doors
     flashed coral in the Reader where the same glyphs stay quiet in her other
     four apps. Scoped out, the doors wear doorbar.css and nothing else.
     reader.js's --dwell-progress mirror is scoped the same way, for the same
     reason. */
  .dwell:not(.bardoor) .dwell-fill { opacity: 0 !important; }
  .dwell:not(.bardoor) .dwell-ring {
    padding: 2px;
    box-shadow: none !important;
    background: conic-gradient(var(--brand-coral) var(--dwell-progress, 0deg), transparent 0deg);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
  }
  .dwell-label { position: relative; z-index: 1; }

  /* ===== Ellie's Bookshelf (gaze-first library) — ported verbatim ===== */
  .shelf { display: grid; gap: 18px; }
  .shelf-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }
  .shelf-heading { margin: 0; font-size: 2rem; }
  .shelf-status { font-size: 1.1rem; }

  /* Generous gutters so gaze drift between cards lands on dead space,
     not on the neighbouring card's dwell target. (The old shelf's drift
     protection — it has NO black rest cells.) */
  .shelf-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 36px;
  }
  .shelf-card { position: relative; }
  .shelf-card-button.dwell-button,
  .shelf-card-box.dwell-button {
    display: grid;
    /* The old app's card is a <button>, so the grid ran on the initial
       alignment: one stretched column, cover at the card's full inner width
       (5 identical 320px squares a row on the I-13). .dwell-button's flex
       centring above sized the column to the TITLE's max-content instead —
       covers came out 113–271px, ragged, card heights 263–344px (dad 9/7:
       "a lot of sizing on the book reader is off"). Keep these resets. */
    align-items: normal;
    justify-content: normal;
    gap: 10px;
    width: 100%;
    padding: 14px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    box-shadow: 0 8px 18px rgba(31, 43, 44, 0.08);
    text-align: center;
  }
  .shelf-cover {
    position: relative;      /* the "Build a book" tag is laid over its bottom */
    display: grid;
    place-items: center;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 14px;
    background: #f0ece0;
  }
  .shelf-cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform-origin: center;
  }
  .shelf-cover-fallback { font-size: 1rem; }
  .shelf-title {
    font-size: 1.48rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.25;
    padding-bottom: 4px;
  }

  /* A BOOK THAT IS NOT A BOOK YET (dad 9/7; spec §13). Two of them: a PILE of
     photos nobody has tapped Build on, and a book being MADE. Both keep
     EXACTLY a real card's box — the picture where the cover goes, the title
     under it, "Build a book" laid over the bottom of the picture — so the slot
     does not reflow the moment the built book takes it. They exist because
     "No books yet — set up Google Drive" is a lie to a family whose Drive is
     set up and whose photos are sitting in it.

     GAZE SAFETY, and it is deliberately NOT "no class" the way the old waiting
     card was. reader.js gives the card and its button `class="dwell"
     data-dwell-disabled`: dwell.js's targetAt() skips [data-dwell-disabled] so
     her gaze can never arm on them, but the tap-parity long-press rescue and
     the context-menu suppression match on `.dwell` ALONE — drop the class and
     a slow press on Windows is dead and a long press opens the right-click
     menu on her shelf. Building is a grown-up's press, made with a finger. */
  .shelf-card.is-pile .shelf-card-box.dwell-button {
    background: rgba(255, 255, 255, 0.62);
    border-style: dashed;
  }
  .shelf-card.is-building .shelf-card-box.dwell-button {
    background: rgba(255, 255, 255, 0.78);
  }
  /* Laid OVER the bottom of the picture, the way the old app's cards wear
     their overlays — the card keeps a real card's shape, and the one thing on
     it a grown-up is looking for is the thing they can press. */
  .shelf-build-tag {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 9px 10px;
    background: rgba(222, 110, 75, 0.94);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 800;
    line-height: 1.2;
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 14px;
  }
  .shelf-waiting-mark {
    display: grid;
    place-items: center;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    background: #f0ece0;
    font-size: 3rem;
  }
  .shelf-waiting-note { font-size: 1rem; line-height: 1.35; }

  /* THE ASK (spec §13). Pressing Build does not build: the card turns into the
     review page's question shape, in this shelf's own idiom rather than that
     page's. The two answers sit at opposite ends of the card, so the press
     that spends a family's allowance can never be the second half of the press
     that asked about it. It fills the slot the card's box just left, so the
     grid around it does not move under her while a grown-up reads it. */
  .shelf-ask {
    display: grid;
    gap: 16px;
    width: 100%;
    padding: 20px 16px;
    border-radius: 20px;
    background: #fff;
    border: 1px solid rgba(222, 110, 75, 0.55);
    box-shadow: 0 8px 18px rgba(222, 110, 75, 0.18);
    text-align: center;
  }
  .shelf-ask-q { margin: 0; font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
  .shelf-ask-actions { display: flex; gap: 18px; justify-content: space-between; }
  .shelf-ask-yes.dwell-button, .shelf-ask-no.dwell-button {
    flex: 1 1 0;
    min-height: 66px;
    border-radius: 999px;
  }
  .shelf-ask-yes.dwell-button {
    background: #2E7D5B;
    border-color: #27694c;
    color: #fff;
  }

  /* ============================================================
     BOOK SHARING (spec 2026-09-22): a grown-up's hold on a book,
     and a grown-up's door for a book somebody sent. Everything
     below belongs to reader-share.js and reader-strip.js, and NOT
     ONE RULE OF IT DESCRIBES A GAZE TARGET — there is no .dwell
     anywhere in this block, on purpose and for ever.
     ============================================================ */

  /* THE HOLD (spec §4.1). Windows' press-and-hold wants to put a right-click
     menu and a selection on her shelf; reader-share.js refuses the contextmenu
     and these two refuse the rest. `manipulation` keeps the shelf scrolling
     and kills only the double-tap zoom. */
  .shelf-card { -webkit-touch-callout: none; touch-action: manipulation; }
  /* The fill, timed off ONE custom property that reader-share.js publishes from
     its own HOLD_MS — so the 1.6 s a grown-up has learned is stated once, in
     the module, and never as a number in a stylesheet that could drift from it.
     It runs along the bottom of the card rather than over the cover: the book
     she was about to open must stay readable under a grown-up's finger. */
  .shelf-card.holding::after {
    content: '';
    position: absolute;
    left: 0; bottom: 0;
    height: 6px;
    width: 0;
    border-radius: 0 0 20px 20px;
    background: var(--brand-coral);
    animation: shelf-hold var(--hold-ms, 1600ms) linear forwards;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes shelf-hold { from { width: 0; } to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) {
    .shelf-card.holding::after { animation: none; width: 100%; opacity: 0.35; }
  }

  /* THE STRIP (spec §5.1), at the bar's RIGHT end. `margin-left:auto` is the
     whole anchoring: the 🚪 is the bar's first flex item and the 💬 is out of
     the flow altogether (doorbar.css positions it absolutely, centred), so
     neither door moves when this appears — which is the law doorbar.js's header
     states and reader-strip.test.mjs measures. The height tracks the bar's own
     --bar-inner, published by sizeBar(), instead of restating 9% of anything. */
  #readerStrip {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stripbtn {
    height: var(--bar-inner, 44px);
    padding: 0 18px;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.16);
    color: var(--bar-ink, #fff);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    white-space: nowrap;
  }
  .stripbtn:active { background: rgba(255, 255, 255, 0.28); }
  .stripbtn:disabled { opacity: 0.45; }
  /* SHELF SCREEN ONLY (spec §5.1). reader.js stamps `reading` on the body for
     the book page, so the rule is read off the state the app already keeps —
     while a book is open the bar belongs to 🚪 and 💬. */
  body.reading #readerStrip { display: none; }

  /* THE TWO GROWN-UP SHEETS. A full-screen backdrop hides NOTHING from
     dwell.js's targetAt() — it walks the elementsFromPoint stack for the first
     .dwell without [data-dwell-disabled] — so the darkness here is for the
     grown-up's eyes only and the real work is reader.js's freeze. */
  .grown-sheet {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(31, 43, 44, 0.55);
    backdrop-filter: blur(3px);
  }
  .share-card, .add-card {
    display: grid;
    gap: 14px;
    justify-items: center;
    width: min(520px, 100%);
    max-height: 100%;
    overflow-y: auto;
    padding: 22px;
    border-radius: 22px;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 18px 44px rgba(31, 43, 44, 0.28);
    text-align: center;
  }
  .share-cover, .add-cover { display: grid; place-items: center; }
  .share-cover img, .add-cover img {
    width: 140px; height: 140px;
    object-fit: cover;
    border-radius: 14px;
    background: #f0ece0;
  }
  .share-title, .add-title { font-size: 1.4rem; font-weight: 700; line-height: 1.25; }
  .share-outs, .add-sources { display: grid; gap: 12px; width: 100%; }
  /* Real buttons, sized for a grown-up's finger at arm's length — and no
     .dwell, so her gaze walks straight over every one of them. */
  .share-out, .add-source, .share-btn, .add-btn {
    min-height: 58px;
    padding: 12px 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
    font-size: 1.08rem;
    font-weight: 700;
    cursor: pointer;
  }
  .share-out, .add-source { width: 100%; }
  .share-out.primary { background: #2E7D5B; border-color: #27694c; color: #fff; }
  .share-out:disabled, .add-source:disabled { opacity: 0.45; cursor: default; }
  /* A sentence a parent can act on — hidden until there is one to say. */
  .share-msg, .add-msg { display: none; font-size: 1.05rem; line-height: 1.4; color: var(--ink); }
  .share-msg.show, .add-msg.show { display: block; }
  .add-link {
    display: inline-block;
    padding: 12px 18px;
    border-radius: 14px;
    background: #2E7D5B;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
  }
  .share-foot, .add-foot { display: flex; justify-content: center; width: 100%; }
  .share-btn, .add-btn { min-width: 140px; border-radius: 999px; }

  /* Personalized ("Ellie's story") books: a warm coral rim so the card reads
     as special from across the room, without changing its shape or size. */
  .shelf-card.is-authored .shelf-card-button.dwell-button {
    border-color: rgba(222, 110, 75, 0.55);
    box-shadow: 0 8px 18px rgba(222, 110, 75, 0.18);
  }
  /* The two badges are ONE pill in two colours. Every measurement below is
     shared, so a card cannot move depending on which badge it wears (and
     reader-sizing.test.mjs cannot be told them apart); only the hue and the
     little mark change. */
  .shelf-authored-badge,
  .shelf-shared-badge {
    position: absolute;
    top: 22px;
    left: 22px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px 5px 9px;
    border-radius: 999px;
    border: 1px solid rgba(222, 110, 75, 0.35);
    background: rgba(255, 255, 255, 0.94);
    color: var(--brand-coral);
    font-size: 0.82rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.01em;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(31, 43, 44, 0.14);
    pointer-events: none;
    z-index: 2;
  }
  /* "From a friend" — a book another family sent (dad, 9/23). The colour is
     #2E7D5B, the green this app already spends on the sharing rail: the "Send
     it now" button in the hold sheet, the "+ Add a book" button that took this
     very book in, and the Settings link. So the badge is the same colour as
     the door the book came through, and no new colour enters the palette.
     Against the coral it is unmistakable at shelf distance (opposite side of
     the wheel), and it is the QUIETER of the two — darker, less saturated, a
     receding hue against coral's advancing one — so her OWN story is still the
     card that stands out. No `.is-shared` rim to go with it, deliberately: the
     coral rim means "this is her story" and two rims would blunt it. */
  .shelf-shared-badge {
    border-color: rgba(46, 125, 91, 0.32);
    color: #2E7D5B;
  }

  /* The shelf's "Back to TD Snap" tile is GONE (9/17): the door is the shared
     bar's 🚪 now, one door per screen, in the corner every other app puts it
     in. Its .shelf-tdsnap-button / .shelf-tdsnap-icon rules went with it. */

  @media (max-width: 680px) {
    .shelf-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 23px; }
    .shelf-title { font-size: 1.1rem; }
    .shelf-authored-badge,
    .shelf-shared-badge { top: 18px; left: 18px; font-size: 0.72rem; }
  }

  /* ===== Reading screen — ported verbatim from the old reader ===== */
  /* the stage owns the screen MINUS the bar (9/17) — it used to own all of it */
  .reader-shell { display: block; margin: 0; padding: 0; height: calc(100dvh - var(--bar-h, 0px)); }
  .reader-stage {
    position: relative;
    height: 100%;
    min-height: 0;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    border: none;
    border-radius: 0;   /* full-bleed: the book owns the whole screen (dad 8/25) */
    overflow: hidden;
    background:
      radial-gradient(circle at top, rgba(255, 245, 224, 0.95), rgba(245, 247, 242, 0.75) 28%),
      linear-gradient(180deg, #f2efe5 0%, #d6dfd9 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
  }
  .reader-overlay-button { pointer-events: auto; }
  .reader-nav-button.dwell-button,
  .reader-library-button.dwell-button { position: absolute; }
  .reader-prev-button { top: 16px; left: 16px; }
  /* Anchored to the bottom-left of the image frame — sits just above the
     text panel, clear of the corner arrows. */
  .reader-library-button { bottom: 12px; left: 16px; }
  .reader-next-button { top: 16px; right: 16px; }

  .reader-next-button-ready {
    top: 50%;
    right: 11%;
    transform: translateY(-50%) scale(5.625);
    transform-origin: center;
    overflow: visible;
  }
  /* Attention ring must HUG the dwell surface: the button's own box is the
     gaze-activatable area, so the visible circle has to match it. */
  .reader-next-button-ready::before {
    content: '';
    position: absolute;
    inset: -4%;
    border-radius: 999px;
    border: 2.5px solid var(--brand-coral);
    pointer-events: none;
    opacity: 0.5;
  }
  .reader-next-button-pulse::before { animation: reader-next-ring-pulse 1.8s ease-in-out infinite; }
  @keyframes reader-next-ring-pulse {
    0%, 100% { opacity: 0.35; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }

  .reader-image-frame {
    position: relative;
    display: block;
    min-height: 0;
    min-width: 0;
    padding: 0;
    overflow: hidden;
  }
  .reader-page-image {
    display: block;
    position: absolute;
    left: 50%;
    top: 50%;
    /* fill the frame exactly like the video does (dad 8/25: the book fills
       the screen in read mode, and NO size jump when the video takes over) */
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 18px 28px rgba(31, 43, 44, 0.12));
    transform: translate(-50%, -50%);
    transform-origin: center;
  }
  /* Per-page video sits on top of the static page image inside the same
     frame (old outro presentation): always mounted, opacity toggled. */
  .reader-outro-video {
    display: block;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 18px 28px rgba(31, 43, 44, 0.12));
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }
  .reader-outro-video-playing { opacity: 1; }

  .reader-image-fallback {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(680px, 100%);
    min-height: 320px;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    border-radius: 22px;
    border: 1px solid rgba(11, 58, 82, 0.14);
    background: rgba(255, 255, 255, 0.74);
    backdrop-filter: blur(10px);
  }

  .reader-bottom-overlay {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 8px;
    padding: 10px 16px 14px;
    max-height: 32vh;
    min-height: 0;
    background: rgba(255, 255, 255, 0.92);
    border-top: 1px solid rgba(11, 58, 82, 0.14);
    backdrop-filter: blur(10px);
    box-shadow: 0 -10px 22px rgba(31, 43, 44, 0.06);
  }
  .reader-status-row {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
  }
  .reader-inline-actions { display: flex; gap: 10px; align-items: center; }
  .reader-book-title, .reader-page-meta { margin: 0; }
  .reader-book-title { font-size: 1.15rem; font-weight: 700; }
  .reader-page-meta { color: var(--muted); font-size: 0.95rem; }

  .reader-text-box {
    min-height: 0;
    height: 100%;
    overflow: auto;
    padding: 8px 2px 2px;
    color: var(--ink);
    line-height: 1.5;
    font-size: 44px;
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .reader-token, .reader-token-gap { white-space: pre-wrap; }
  .reader-token {
    border-radius: 8px;
    transition: background-color 120ms linear, transform 120ms linear;
  }
  .reader-token.active { background: var(--highlight-yellow); padding: 0 4px; }
  .reader-token-gap { color: inherit; }
  .reader-arrow { font-size: 1.45em; line-height: 1; }

  .reader-overlay-button.dwell-button {
    min-height: 58px;
    min-width: 58px;
    padding: 10px 14px;
    border-radius: 999px;
    border-color: rgba(11, 58, 82, 0.18);
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 6px 14px rgba(31, 43, 44, 0.1);
  }
  /* Plain-glyph nav arrows: no circular chrome, no background */
  .reader-nav-button.reader-overlay-button.dwell-button {
    min-height: auto;
    min-width: auto;
    padding: 6px 12px;
    background: transparent;
    border: none;
    box-shadow: none;
    border-radius: 0;
    z-index: 5;
    overflow: hidden;
  }
  .reader-next-button-ready.reader-nav-button.reader-overlay-button.dwell-button { overflow: visible; }
  .reader-nav-button .dwell-ring { border-radius: 999px; }
  .reader-prev-button {
    color: var(--ink);
    font-size: 3.2rem;
    font-weight: 900;
    line-height: 1;
    text-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
  }
  .reader-next-button {
    color: var(--brand-coral);
    font-size: 3.2rem;
    font-weight: 900;
    line-height: 1;
    text-shadow: 0 0 6px rgba(255, 255, 255, 0.7);
  }
  .reader-library-button.dwell-button,
  .reader-read-button.dwell-button { min-width: 104px; border-radius: 999px; font-size: 0.98rem; }
  .reader-read-button { position: static; }
  .reader-next-button-ready.dwell-button { min-width: 84px; min-height: 84px; padding: 16px; }

  /* End-of-book: the Library button grows 5x at the left-center of the
     stage and pulses gently (same ring language as the ready next-arrow)
     to invite the child back to the shelf. */
  .reader-library-button-finished.dwell-button {
    bottom: auto;
    top: 50%;
    left: 5%;
    transform: translateY(-50%) scale(5);
    transform-origin: left center;
    overflow: visible;
    z-index: 5;
    color: var(--brand-coral);
    font-weight: 800;
  }
  .reader-library-button-finished::before {
    content: '';
    position: absolute;
    inset: -18%;
    border-radius: 999px;
    border: 2px solid var(--brand-coral);
    pointer-events: none;
    opacity: 0.5;
    animation: reader-next-ring-pulse 2.2s ease-in-out infinite;
  }

  @media (max-width: 900px) {
    .reader-stage { border-radius: 18px; }
    .reader-bottom-overlay { padding: 12px; }
    .reader-status-row { flex-wrap: wrap; }
    .reader-text-box { font-size: 34px; }
    .reader-next-button-ready { right: 84px; transform: translateY(-50%) scale(2.94); }
  }
  @media (max-width: 680px) {
    .reader-prev-button { top: 14px; left: 14px; }
    .reader-library-button { bottom: 10px; left: 14px; }
    .reader-next-button, .reader-next-button-ready { right: 14px; }
    .reader-bottom-overlay { gap: 10px; padding: 12px; }
    .reader-status-row { align-items: flex-start; flex-direction: column; }
  }

  /* black rest area — READING page only (contract; the old reading page had
     none in-frame and the old shelf's drift protection is its gutters).
     READER HAS NO BLACK REST SPOT (dad's ruling 8/25, deviates from the
     board UX contract deliberately: dead margins + the text panel are the
     park space here; "I don't think necessary for this app"). */
</style>
</head>
<body>

<!-- ONE bar for both screens (spec §6.1): the shelf and the book page are two
     fixed panels under the same strip, so the door does not move — and is not
     rebuilt — when she opens a book or comes back to the shelf. -->
<div id="bar"></div>

<div id="sShelf" class="screen show">
  <section class="shelf">
    <header class="shelf-header">
      <h2 class="shelf-heading" id="shelfTitle">My Bookshelf</h2>
    </header>
    <!-- THE EMPTY SHELF SAYS ONE OF TWO THINGS, and until 9/7 it always said
         the first: "set up Google Drive", shown to a family whose Drive was set
         up perfectly and whose photos were sitting in it. The link is the right
         answer only when this computer has no Drive folder; when it HAS one the
         honest sentence is where to put the photos. reader.js picks. -->
    <div class="shelf-status" id="shelfEmpty" hidden style="text-align:center">
      <p class="muted" style="font-size:22px" id="shelfEmptyLine">No books yet.</p>
      <a href="/settings/#integrations" id="shelfEmptyLink"
         style="display:inline-block;background:#2E7D5B;color:#fff;border-radius:14px;
         padding:16px 22px;text-decoration:none;font-size:19px;margin-top:6px">📚 Add books with Google Drive —
         set it up in Settings</a>
    </div>
    <div class="shelf-grid" id="shelfGrid"></div>
  </section>
</div>

<div id="sRead" class="screen">
  <section class="reader-shell">
    <div class="reader-stage">
      <div class="reader-image-frame" id="imageFrame">
        <img id="pageImg" class="reader-page-image" alt="">
        <div class="reader-image-fallback" id="imgFallback" hidden><p class="muted">Page image unavailable.</p></div>
        <video id="pageVideo" class="reader-outro-video" playsinline preload="auto"></video>
        <div class="dwell dwell-button reader-overlay-button reader-library-button" id="btnLibrary"
             data-dwell-say="library" aria-label="Back to library"><span class="dwell-label">Library</span></div>
        <div class="dwell dwell-button reader-overlay-button reader-nav-button reader-prev-button" id="btnPrev"
             data-dwell-say="go back" aria-label="Previous page"><span class="dwell-label reader-arrow" aria-hidden="true">&#8592;</span></div>
        <div class="dwell dwell-button reader-overlay-button reader-nav-button reader-next-button" id="btnNext"
             data-dwell-say="turn the page" aria-label="Next page"><span class="dwell-label reader-arrow" aria-hidden="true">&#8594;</span></div>
      </div>
      <div class="reader-bottom-overlay">
        <div class="reader-status-row">
          <div>
            <p class="reader-book-title" id="bookTitle"></p>
            <p class="reader-page-meta" id="pageMeta"></p>
          </div>
          <div class="reader-inline-actions">
            <div class="dwell dwell-button reader-overlay-button reader-read-button" id="btnRead"
                 data-dwell-say="read" aria-label="Read page"><span class="dwell-label" id="btnReadLabel">Read</span></div>
          </div>
        </div>
        <div class="reader-text-box" id="pageText"></div>
      </div>
    </div>
  </section>
</div>


<audio id="narration" preload="auto"></audio>

<script>
  // Narration is the package's recorded audio; a spoken dwell preview over it
  // would talk across the story — and this app must NEVER call speechSynthesis.
  // color: the old UI's coral, so the engine's activation flash matches.
  // chime:false — the activation tone beeped over every page turn (dad 8/25);
  // a listening app must never make its own noise (narration is the audio).
  window.DwellConfig = { audioPreview: false, chime: false, color: "#de6e4b" };
</script>
<script src="../dwell.js"></script>
<script type="module">
  // door-bar shim (the Pencil's precedent): reader.js stays a CLASSIC script —
  // the suites reach window.Reader and the file's own globals — and a module
  // runs before a deferred classic in document order, so window.DoorBar is
  // there by the time boot() asks for it.
  import { mountDoorBar, barHeight } from "../lib/doorbar.js";
  import { CONTRACT, holdFor, holdForExit } from "../lib/contract.js";
  window.DoorBar = { mountDoorBar, barHeight };
  window.EllieContract = { CONTRACT, holdFor, holdForExit };
</script>
<script src="reader.js" defer></script>
<!-- Book sharing (spec 2026-09-22), and AFTER reader.js on purpose: both are
     classic scripts, deferred scripts run in document order, and each of these
     borrows reader.js's freeze off window.Reader. Neither is a gaze target and
     neither speaks — they are the two grown-up doors on this screen, the finger
     hold that sends a book and the strip button that takes one in. -->
<script src="reader-share.js" defer></script>
<script src="reader-strip.js" defer></script>
</body>
</html>
