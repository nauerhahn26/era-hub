<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<!-- Play — the This week app's third door (spec docs/specs/2026-10-12-weekly-suite-design.md §5.1,
     §5.2, §5.6): a menu of up to three engines (Which one?, Sort it, Play it) filled from the week's
     validated play.json. A hub app page in Drawing's mould: the shared door bar, the contract,
     dwell.js, speech.js, celebrate.js. Never a test: nothing scores, every pick is logged silently. -->
<link rel="stylesheet" href="../lib/tokens.css">
<link rel="stylesheet" href="../lib/doorbar.css">
<link rel="stylesheet" href="play.css">
<script>
  window.DwellConfig = {
    ms: 1200, graceMs: 400, decayMs: 1000, padPx: 16, rearmPx: 48,
    audioPreview: false, chime: false, bus: "auto", staleMs: 600, color: "#0F7C8A"
  };
</script>
</head>
<body>
<!-- under the bar: the rail (Back at the top seat, two black rest boxes) and the stage, which
     play.js fills with the menu or an engine's page -->
<main id="screen">
  <nav id="rail" aria-label="Back">
    <button type="button" id="btnBack" class="railTile dwell" aria-label="Back">
      <span class="glyph" aria-hidden="true">←</span><span class="word">Back</span></button>
    <div class="black" aria-hidden="true"></div>
    <div class="black" aria-hidden="true"></div>
  </nav>
  <section id="stage" aria-live="polite"></section>
</main>
<script src="../dwell.js"></script>
<script src="../speech.js"></script>
<script type="module" src="play.js"></script>
</body>
</html>
